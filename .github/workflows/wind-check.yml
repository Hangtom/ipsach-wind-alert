name: Check Ipsach wind

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipsach-wind-check
  cancel-in-progress: false

jobs:
  check-wind:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check wind and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_THRESHOLD: "10"
          RESET_THRESHOLD: "4"
          RESET_MINUTES: "30"
        run: python3 wind_alert.py

      - name: Save anti-spam state
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update wind alert state [skip ci]"
          git push
